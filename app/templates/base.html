<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}{% endblock %} · Personal Wealth Manager</title>
<link rel="stylesheet" href="/static/css/pwm.css">
</head>
<body>
{% set caminho = request.url.path %}
<div class="app">
  <aside class="lateral">
    <div class="marca">Personal Wealth Manager<small>Património da família</small></div>
    <nav aria-label="Principal">
      <a href="/"{% if caminho == '/' %} aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 19V10M10 19V5M16 19v-6M22 19H2"/></svg>
        Painel</a>
      <a href="/checkin"{% if caminho.startswith('/checkin') %} aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M8.5 13.5l2.5 2.5 4.5-5"/></svg>
        Check-in mensal</a>
      <a href="/plataformas"{% if caminho.startswith('/plataformas') %} aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>
        Plataformas</a>
      <a href="/indices"{% if caminho.startswith('/indices') %} aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 3 8-8M15 7h5v5"/></svg>
        Índices</a>
    </nav>
    <form class="sair" method="post" action="/sair" id="form-sair">
      <button type="submit" class="secundario">Guardar e sair</button>
      <p>Faz a cópia de segurança e fecha a aplicação.</p>
    </form>
  </aside>
  <main class="conteudo">
{% block conteudo %}{% endblock %}
  </main>
</div>
<script>
// "Guardar e sair" faz a cópia de segurança e fecha a aplicação, mas não grava formulários.
// Avisa se algum formulário marcado com data-avisar-sair tem valores diferentes dos que vieram da base
// (defaultValue/defaultChecked = o que o servidor escreveu na página) ou se veio de um erro
// (data-por-gravar: o que lá está foi escrito mas não gravado).
(() => {
  const sair = document.getElementById('form-sair');
  if (!sair) return;
  const alterado = el => {
    if (el.type === 'checkbox' || el.type === 'radio') return el.checked !== el.defaultChecked;
    if (el.tagName === 'SELECT') {
      const original = [...el.options].findIndex(o => o.defaultSelected);
      return el.selectedIndex !== (original < 0 ? 0 : original);
    }
    if (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA') return false;
    if (['hidden', 'submit', 'button', 'reset'].includes(el.type)) return false;
    return el.value !== el.defaultValue;
  };
  sair.addEventListener('submit', ev => {
    const porGravar = [...document.querySelectorAll('form[data-avisar-sair]')]
      .some(f => f.hasAttribute('data-por-gravar') || [...f.elements].some(alterado));
    if (porGravar && !confirm('Há valores escritos que ainda não foram gravados. Sair mesmo assim? (Perdem-se.)')) {
      ev.preventDefault();
    }
  });
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
